<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9f7f7">
<title>仕事のお金まわり・つまずきタイプ診断 | Radiant visionaries</title>
<style>
:root{--ink:#465357;--muted:#718084;--aqua:#e9f7f7;--teal:#74bdbf;--deep:#347f83;--yellow:#f4dfa0;--white:#fff;--line:#d9e8e8;--shadow:0 14px 38px rgba(43,95,96,.075)}*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:#f9fcfb;color:var(--ink)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 96% 5%,#e5f6f4 0,transparent 32%),linear-gradient(#fcfefe,#f8fcfb)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e0b341;outline-offset:3px}.shell{width:min(100% - 32px,660px);margin:0 auto;padding:30px 0 52px}.brand{font-family:Georgia,serif;font-size:19px;color:#398d90;letter-spacing:.07em;text-align:center;margin-bottom:24px}.panel{background:var(--white);border:1px solid #e4eeee;border-radius:23px;padding:clamp(23px,5.5vw,43px);box-shadow:var(--shadow)}.eyebrow{color:var(--deep);font-size:12px;letter-spacing:.16em;font-weight:700}.headline{font-size:clamp(25px,6vw,34px);letter-spacing:.03em;line-height:1.55;margin:14px 0 17px;font-weight:700}.description{line-height:2;color:#5f6f73;font-size:15px}.quiet{font-size:13px;color:var(--muted);line-height:1.85}.center{text-align:center}.pill{display:inline-flex;align-items:center;background:#eaf7f6;color:#427f80;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600}.accent{width:46px;height:4px;background:var(--yellow);border-radius:12px;margin:23px auto}.primary{border:0;background:#438e91;color:#fff;border-radius:13px;padding:16px 22px;font-weight:700;font-size:15px;min-height:53px;width:100%;transition:background .18s}.primary:hover{background:#32797c}.secondary{background:transparent;border:1px solid #bfdbdc;color:#377d80;border-radius:13px;padding:13px 20px;font-size:14px;min-height:47px}.actions{margin-top:29px}.progress-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#648083;font-weight:600;margin-bottom:13px}.track{height:7px;background:#e6f1f1;border-radius:999px;overflow:hidden}.fill{height:100%;background:#6db3b4;transition:width .2s}.question{font-size:clamp(20px,4.6vw,25px);line-height:1.6;margin:27px 0 9px}.choices{display:grid;gap:11px;margin-top:25px}.choice{min-height:63px;width:100%;text-align:left;border:1.5px solid #dce9e8;background:#fff;border-radius:13px;padding:15px 17px;color:var(--ink);font-size:14.5px;line-height:1.6;display:flex;align-items:center;gap:13px}.choice:hover{background:#f5fbfa}.choice.selected{background:#e9f7f5;border-color:#66aeb0}.dot{width:19px;height:19px;flex:none;border:1.5px solid #afc9c8;border-radius:50%;display:inline-grid;place-items:center}.choice.selected .dot{border-color:#398e90;background:#398e90;color:#fff}.choice.selected .dot:after{content:'✓';font-size:12px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:28px}.nav .secondary{flex:1}.nav .primary{flex:2}.nav button:disabled{opacity:.4;cursor:not-allowed}.result-name{font-size:clamp(24px,6vw,31px);line-height:1.6;margin:11px 0}.result-lead{font-size:15px;line-height:1.95;margin:18px 0 28px}.section{border-top:1px solid #e2eded;padding:21px 0 2px}.section h3{font-size:15px;color:#357d80;margin:0 0 9px}.section p{font-size:14px;line-height:1.95;margin:0 0 15px;white-space:pre-line}.step{background:#f0f8f7;border-radius:13px;padding:18px 20px;margin:12px 0 8px;font-size:15px;font-weight:700;line-height:1.9}.booking{margin-top:30px;background:#f7fbfa;border:1px solid #dceaea;border-radius:17px;padding:24px 21px}.booking h3{font-size:17px;margin:0 0 18px}.booking p{font-size:14px;line-height:2;white-space:pre-line;margin:0 0 20px}.booking a{text-decoration:none;display:block;text-align:center}.footer{margin-top:27px;text-align:center;font-size:12px;line-height:1.9;color:#879394}.result-bottom{margin-top:20px} .hidden{display:none!important}@media(max-width:380px){.shell{width:calc(100% - 22px);padding-top:20px}.panel{padding:22px 18px}.choice{padding:13px;font-size:14px}.booking{padding:20px 16px}}
</style>
</head>
<body><main class="shell"><div class="brand">Radiant visionaries</div><div id="app" aria-live="polite"></div><footer class="footer">想いをかたちに、数字を未来に<br>Radiant visionaries</footer></main>
<script>
/* 編集用データ: 質問・選択肢・配点は以下で一括管理 */
const QUESTIONS=[
 {id:'stage',title:'今、仕事のお金の記録はどんな状態ですか？',sub:'近いものをひとつ選んでください',options:[['まだ何も始めていない',{A:3}],['ときどきメモや記録をしている',{A:1,B:1}],['記録の方法は決まっているけれど、たまっている',{B:3}],['定期的に記録できている',{C:1,D:2}]]},
 {id:'receipts',title:'レシートや仕事の明細は、どうしていますか？',sub:'きれいに整理できていなくても大丈夫です',options:[['どこにあるか分からないものもある',{A:2}],['とりあえず一か所に集めている',{A:1,B:1}],['月ごとにまとめたいけれど、たまりがち',{B:3}],['探したいときに確認できるようにしている',{C:1,D:1}]]},
 {id:'block',title:'お金の記録や確認で、いちばん止まりやすいのは？',sub:'今の気持ちに近いものを選んでください',options:[['何から始めて、何を書けばいいか迷う',{A:5}],['やり方は分かるけれど、時間を取れない',{B:5}],['記録しても、お金がいくら残るか見えにくい',{C:5}],['記録した数字を仕事の計画に生かすところ',{D:5}]]},
 {id:'monthly',title:'先月の売上と経費は、どのくらい分かりますか？',sub:'売上は入ってきたお金、経費は仕事に使ったお金です',options:[['どちらもすぐには分からない',{A:2,C:1}],['売上は分かるけれど、経費はあいまい',{C:3}],['調べたり計算したりすれば分かる',{B:1,C:2}],['売上も経費もすぐ確認できる',{D:2}]]},
 {id:'remaining',title:'仕事で手元に残るお金を、把握できていますか？',sub:'ここでは「売上から経費を引いた金額」をイメージしてください',options:[['まだ考えたことがない',{A:1,C:2}],['なんとなく感覚で捉えている',{C:3}],['計算すれば確認できる',{C:1,D:1}],['毎月おおよそ確認できている',{D:3}]]},
 {id:'goals',title:'価格や売上目標は、どう決めていますか？',sub:'「これから決めたい」でも大丈夫です',options:[['まだ決め方が分からない',{A:2}],['周りの価格や感覚を参考にしている',{C:2}],['目標はあるけれど、数字の根拠はあいまい',{C:2,D:1}],['経費や必要なお金を見ながら考えている',{D:3}]]},
 {id:'future',title:'これからの支払いや収支の見通しは？',sub:'今後3か月くらいを思い浮かべてください',options:[['何を見通せばいいのか迷う',{A:2}],['目の前の仕事が優先で、考える時間が取れない',{B:2}],['必要だと思うけれど、数字にできていない',{C:2,D:1}],['見通しは立てていて、もっと行動に生かしたい',{D:3}]]}
];
const RESULTS={
 A:{name:'はじめの一歩で迷うタイプ',lead:'「ちゃんとしたい」という気持ちはあるのに、どこから手をつけようか迷いやすい時期かもしれません',strength:'お金まわりを整えたいと思えたことが、すでに大切なスタートです',challenge:'最初からきれいな帳簿を作ろうとすると、何をそろえるかだけで疲れてしまうことも',step:'今日の売上・経費に関する資料を、一か所に集めてみましょう'},
 B:{name:'つい後回しタイプ',lead:'やることは何となく分かっているのに、日々のお仕事を優先して、記録が後回しになりやすい時期かもしれません',strength:'自分に合う方法のイメージがあることは強みです　あとは続けやすい仕組みにするだけ',challenge:'まとまった時間ができてから、と考えるほど、手をつけるハードルが上がりがちです',step:'カレンダーに「帳簿を開く日」を1日だけ入れてみましょう'},
 C:{name:'お金の流れがぼんやりタイプ',lead:'記録や売上の把握は進みつつも、仕事にいくら使い、どれくらい残っているかを見渡しにくい時期かもしれません',strength:'「数字を見えるようにしたい」という視点が、次の行動につながります',challenge:'売上だけを見ていると、使ったお金や残るお金を把握しにくくなります',step:'先月の売上と経費を、紙に2列で並べてみましょう'},
 D:{name:'数字を未来に生かしたいタイプ',lead:'日々の記録や収支の確認がある程度できていて、その数字を次の計画につなげたい時期かもしれません',strength:'お仕事のお金を確認する土台があることは、大きな強みです',challenge:'過去の数字を確認するだけで終わると、これからの行動を考える材料として生かしにくいことも',step:'これから3か月の売上と経費の見込みを、月ごとに書いてみましょう'}
};
/* 判定仕様: 全回答の加点 → 状況に合わないタイプを除外 → 最高点 → 同点時は C,B,A,D の順 */
const TIE_ORDER=['C','B','A','D'];
function diagnose(answers){let s={A:0,B:0,C:0,D:0};QUESTIONS.forEach((q,i)=>{let scores=q.options[answers[i]][1];for(let k in scores)s[k]+=scores[k]});const stage=answers[0],monthly=answers[3],remaining=answers[4];let eligible=['A','B','C','D'];if(stage===3){eligible=eligible.filter(x=>x!=='A'&&x!=='B')}if(stage===0){eligible=eligible.filter(x=>x!=='D')}if(stage===1||stage===2){eligible=eligible.filter(x=>x!=='D')}if(monthly!==3||remaining<2){eligible=eligible.filter(x=>x!=='D')}if(stage===3&&monthly===3&&remaining>=2){eligible=eligible.filter(x=>x!=='A'&&x!=='B')}let max=Math.max(...eligible.map(k=>s[k]));return {type:TIE_ORDER.find(k=>eligible.includes(k)&&s[k]===max),scores:s,eligible};}
const app=document.querySelector('#app');let answers=Array(QUESTIONS.length).fill(null),page=-1;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){window.scrollTo({top:0,behavior:'instant'});if(page===-1){app.innerHTML=`<section class="panel center"><div class="eyebrow">FREE SELF CHECK</div><div class="accent"></div><h1 class="headline">仕事のお金まわり<br>つまずきタイプ診断</h1><p class="description">今の自分に合う、お金まわりの整え方は？<br>7つの質問で、つまずきやすいポイントと<br>今日からできる小さな一歩を見つけましょう</p><p class="pill">全7問 ・ 約2〜3分</p><p class="quiet">正解・不正解はありません<br>性格や能力を判定するものではなく、今の状況を整理するセルフチェックです</p><div class="actions"><button class="primary" id="start">診断をはじめる →</button></div></section>`;document.querySelector('#start').onclick=()=>{page=0;render()};return}
if(page<QUESTIONS.length){const q=QUESTIONS[page];app.innerHTML=`<section class="panel"><div class="progress-top"><span>QUESTION ${page+1} / ${QUESTIONS.length}</span><span>${Math.round(100*page/QUESTIONS.length)}%</span></div><div class="track"><div class="fill" style="width:${page/QUESTIONS.length*100}%"></div></div><h1 class="question">${esc(q.title)}</h1><p class="quiet">${esc(q.sub)}</p><div class="choices" role="radiogroup" aria-label="${esc(q.title)}">${q.options.map((o,i)=>`<button type="button" class="choice ${answers[page]===i?'selected':''}" role="radio" aria-checked="${answers[page]===i}" data-index="${i}"><span class="dot"></span><span>${esc(o[0])}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="back">← 戻る</button><button class="primary" id="next" ${answers[page]===null?'disabled':''}>${page===QUESTIONS.length-1?'結果を見る →':'次へ →'}</button></div></section>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{answers[page]=Number(b.dataset.index);render()});document.querySelector('#back').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{if(answers[page]!==null){page++;render()}};return}
const result=diagnose(answers);const r=RESULTS[result.type];app.innerHTML=`<section class="panel"><div class="eyebrow center">YOUR RESULT</div><div class="accent"></div><p class="center quiet">今のあなたに近いのは…</p><h1 class="result-name center">${esc(r.name)}</h1><p class="result-lead center">${esc(r.lead)}</p><div class="section"><h3>🌱 今できていること・強み</h3><p>${esc(r.strength)}</p></div><div class="section"><h3>🔍 つまずきやすいポイント</h3><p>${esc(r.challenge)}</p></div><div class="section"><h3>✨ 今日できる小さな一歩</h3><div class="step">${esc(r.step)}</div><p class="quiet">全部を一度に整えなくても大丈夫です<br>ほかのタイプの特徴が重なることもあります</p></div><div class="booking"><h3>パーソナルヒアリング｜30分・無料</h3><p>診断結果はいかがでしたか？🌷

「私の場合、何から始めたらいい？」
「このつまずきを解消したい」

そんな方へ
診断結果と今のお仕事の状況をもとに
お金まわりを整える次の一歩を一緒に考えます

お悩みやご希望に応じて
講座などのサポートもご紹介します

お申し込みの際は、診断で出たタイプを
予約フォームのコメント欄にご記入ください😊</p><a class="primary" href="https://calendar.app.google/suGHQ3ocGMuP8XPD8" target="_blank" rel="noopener noreferrer">無料ヒアリングの日時を選ぶ ↗</a></div><div class="result-bottom"><button class="secondary" style="width:100%" id="restart">↺ もう一度診断する</button></div><p class="quiet center">これは回答から現在の状況を整理するセルフチェックです<br>性格や能力を判定するものではありません</p></section>`;document.querySelector('#restart').onclick=()=>{answers=Array(QUESTIONS.length).fill(null);page=-1;render()}}
render();
</script></body></html>
